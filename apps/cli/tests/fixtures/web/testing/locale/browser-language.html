        const RTL_LANGUAGES = ["ar", "he"];

        function updatePage() {
            const locale = navigator.language;
            const baseLang = locale.split("-")[0];

            document.getElementById("current-locale").textContent = locale;
            document.getElementById("greeting-text").textContent = GREETINGS[baseLang] || GREETINGS["en"];

            const sampleEl = document.getElementById("sample-text");
            sampleEl.textContent = SAMPLE_TEXTS[baseLang] || SAMPLE_TEXTS["en"];
            if (RTL_LANGUAGES.includes(baseLang)) sampleEl.setAttribute("dir", "rtl");
        }

        updatePage();
