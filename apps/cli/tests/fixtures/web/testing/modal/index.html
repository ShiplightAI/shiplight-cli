<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal Test Page</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 40px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    .content {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
    }
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      padding: 30px;
      border-radius: 12px;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .modal h2 {
      margin: 0 0 15px 0;
      color: #333;
    }
    .modal p {
      color: #666;
      margin: 0 0 20px 0;
    }
    .modal button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    .modal button:hover {
      background: #0056b3;
    }
    .hidden { display: none; }
    #action-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Modal Test Page</h1>
  <div class="content">
    <p>This page displays a modal on load to test the modal auto-dismissal feature.</p>
    <button id="action-btn">Click Me After Modal Dismissed</button>
    <p id="result" style="margin-top: 20px; color: green;"></p>
  </div>

  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h2>Welcome!</h2>
      <p>This is a test modal that appears on page load.</p>
      <button id="close-modal">Close Modal</button>
    </div>
  </div>

  <script>
    document.getElementById('close-modal').addEventListener('click', function() {
      document.getElementById('modal-overlay').classList.add('hidden');
    });

    document.getElementById('action-btn').addEventListener('click', function() {
      document.getElementById('result').textContent = 'Button clicked successfully!';
    });
  </script>
</body>
</html>
