<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px;
            margin: 0;
            background: #f8f9fa;
        }
        h3 { margin-top: 0; color: #1a1a2e; }
        .inner-frame {
            width: 100%;
            height: 150px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #outer-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <h3>Outer Frame</h3>
    <input id="outer-input" type="text" placeholder="Type in outer frame..." />
    <iframe id="inner-frame" class="inner-frame" title="Inner frame" src="./iframe-inner.html"></iframe>
</body>
</html>
