      by 002 (`shiplight create` / `create --json`); the MCP `scaffold_project`
      tool was removed in the authoring-boundary change and 003's surface is
      session-bound."
    - "Cloud/hosted surfaces (e.g. apps/frontend email-forwarding v2
      integration) are out of scope for this published-tooling round and are not
      modeled as features here."
    - "Gap-closure campaign (.quality/notes/gap-closure-plan.md): ranked
      gaps 1-4 closed with deterministic tests; per-feature test-spec.md
      authored."
    - "Quality-evidence improvement
      (.quality/notes/improvement-progress.md): low runtime quality score
      is an OBSERVATION-WIRING gap (unit lanes emit no ingestable JUnit), not a
      missing-test gap. Observation wiring merged via PR #2088; awaits QC scan
      to flip A+D items to observed."
  orphan_code_refs: []
  specs_without_implementation: []
  implementation_without_specs: []
  tests_without_specs: []
  evidence_gaps:
