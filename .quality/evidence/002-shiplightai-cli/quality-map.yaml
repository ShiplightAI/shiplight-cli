# How this map's STRUCTURE (its check list) was produced. Reconstructed from the
# shipped CLI (every check is source_type IMPLEMENTATION), not from an accepted spec
# or a human-authored check list — so structure_provenance stays
# inferred_brownfield. That field records where the checks came from, and an
# owner's approval does not rewrite their origin.
#
# checks_reviewed: the owner reviewed the whole check list on 2026-08-10 and
# approved it, including exp-local-references, re-homed here from 003 the same
# day. That approval is what lifts these checks' structure confidence; the
# origin above deliberately stays as it was.
structure_provenance: "inferred_brownfield"
checks_reviewed: true
target:
  id: "002-shiplightai-cli"
  name: "shiplightai CLI & Playwright Library"
  scope: "feature"
  aliases: []
  source_refs:
    - path: "specs/002-shiplightai-cli/spec.md"
      label: "Reconstructed feature spec"
    - path: "project-map.yaml"
      label: "Project map feature entry"
    - path: "https://docs.shiplight.ai/local/cli-reference"
      label: "CLI reference docs (SOURCE)"
    - path: "apps/cli/README.md"
      label: "Published package README (observed)"
    - path: "apps/cli"
      label: "CLI implementation"

expectations:
  - id: exp-env-allowlist
    title: "Only allowlisted env vars reach the agent SDK; shell/CI secrets never leak"
    description: >-
      buildSdkEnv copies exactly the env-key allowlist (LLM keys, Vertex routing,
      Mailgun, SHIPLIGHT_API_*) and strips PATH/HOME/USER/SSH_*/GITHUB_TOKEN/AWS_*/
      NPM_TOKEN; the agent fixture configures the SDK exclusively via buildSdkEnv(),
      never from process.env. This is the security boundary for what the AI agent sees.
    source_type: IMPLEMENTATION
    source_refs:
      - path: "apps/cli/src/fixture.allowlist.test.ts"
      - path: "apps/cli/src/fixture.allowlist.wiring.test.ts"
      - path: "apps/cli/src/dotenvSource.ts"
    category: security
    priority: P0
    evidence:
      - id: ev-allowlist-unit
        type: unit
        path: "apps/cli/src/fixture.allowlist.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: "Pins the exact allowlist copied into the SDK env and the strip of PATH/HOME/SSH_*/GITHUB_TOKEN/AWS_*/NPM_TOKEN."
      - id: ev-allowlist-wiring-guard
        type: static
        path: "apps/cli/src/fixture.allowlist.wiring.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: "Source-integrity guard: the agent fixture makes exactly one configureSdk call sourced only from buildSdkEnv(), never from process.env."
      - id: ev-allowlist-runtime-noleak
        type: integration
        path: "apps/cli/src/fixture.allowlist.runtime.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: >-
          Runtime upgrade over the STATIC wiring guard: executes the real startup chain
          with a polluted process.env (GITHUB_TOKEN/NPM_TOKEN/AWS_*/SSH_AUTH_SOCK) —
          loadShiplightEnv() seeds the stash from the full process.env, then
          buildSdkEnv() -> configureSdk() -> getSdkConfig().env — and asserts the SDK
          stores ONLY the allowlist (allowlisted value flows through; no secret key or
          value leaks). Mutation-verified: adding GITHUB_TOKEN to the allowlist fails it.

