        contexts: ["local", "pr-ci"]
        notes: "Covers per-test override precedence, viewport:null incompatibility drop, and the Playwright context-option drift guard."
    proof_gap:
      summary: "The drift guard parses Playwright internals by file path. Playwright 1.58.2 removed lib/coreBundle.js (the guard now reads lib/server/browserContext.js, with coreBundle.js as a fallback); a future relocation now fails loudly with an 'internals moved' assertion rather than a raw ENOENT, but still needs a path update on such a bump."
      next_step: "On Playwright upgrades, if the guard asserts 'internals moved', add the new validateBrowserContextOptions source path to the candidates list."

