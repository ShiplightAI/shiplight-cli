  - id: exp-config-roots
    title: "shiplightConfig anchors scanDir and projectRoot correctly"
    description: >-
      resolveScanRoots keeps projectRoot pinned to the TRUE project root while
      scanDir narrows what is scanned: with no scanDir and no env both default to
      cwd; SHIPLIGHT_PROJECT_ROOT sets projectRoot and scanDir falls back to it; an
      explicit (relative or absolute) scanDir narrows the scan but projectRoot stays
      the root. .env discovery walks up and stops at the project root with
      closest-wins precedence. Auth scripts, the Chrome extension, and upload data
      dirs all anchor to this resolved root, not cwd.
    source_type: IMPLEMENTATION
    source_refs:
      - path: "apps/cli/src/config.ts"
      - path: "apps/cli/tests/unit/config.test.ts"
    category: other
    priority: P1
    evidence:
      - id: ev-config-roots-unit
        type: unit
        path: "apps/cli/tests/unit/config.test.ts"
        command: "cd apps/cli && pnpm test:logic"
        contexts: ["local", "pr-ci"]
        notes: >-
          Covers resolveScanRoots precedence (default cwd, env-set projectRoot,
          explicit relative + absolute scanDir narrowing while projectRoot stays the
          true/env root) and shiplightConfig .env walk-up with stop-at-root and
          closest-wins precedence.
    proof_gap:
      summary: "Root resolution is proven directly; that downstream auth/extension/upload consumers actually anchor to the resolved root is covered by their own checks, not joined here."
      next_step: "Optional: an integration test asserting an auth script path resolves against projectRoot when run from a nested scanDir."

  - id: exp-usage-summary
    title: "Per-run LLM usage is aggregated, billing-labeled, and survives shard merge"
    description: >-
      The reporter folds a per-run LLM usage summary into report-data.json at
      report time: each tracked call maps to the right operation (action/draft/
      verify_ai/evaluate_if/evaluate_while/evaluate_wait_until), buckets by
      (operation, provider, model, routing), sums correctly across shards
      without mutating inputs, and rides the run-complete upload. Routing is
      labeled per bucket provider from the Shiplight .env stash mirroring
      sdk-core's provider selection (direct key/Vertex flag -> byok, OpenAI
      key + base URL -> custom_endpoint, token path -> proxy), so the
      analytics plane can attach cost only to genuinely proxied traffic.
      Declared as FR-012 in the feature spec; runner half of the cloud service spec 047.
    source_type: IMPLEMENTATION
    structure_provenance: "agent_generated"
    source_refs:
      - path: "specs/002-shiplightai-cli/spec.md"
        label: "FR-012 declaration"
      - path: "specs/002-shiplightai-cli/run-usage-summary/test-spec.md"
        label: "Change test spec (priorities)"
      - path: "apps/cli/src/reporter/runUsageAggregate.ts"
      - path: "packages/sdk-core/src/agent/runUsageSummary.ts"
    category: ops
    priority: P1
    evidence:
      - id: ev-usage-sdk-unit
        type: unit
        path: "packages/sdk-core/src/agent/__tests__/runUsageSummary.test.ts"
        command: "cd packages/sdk-core && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: "Pure aggregator: operation mapping incl. the WAIT_UNTIL split, multi-poll counting, provider inference, bucketing, and empty-input handling."
      - id: ev-usage-aggregate-unit
        type: unit
        path: "apps/cli/src/reporter/runUsageAggregate.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: >-
          Reporter half: shard merge (summing, distinct buckets incl.
          routing-only differences, no mutation, deterministic order),
          temp-dir glob/parse aggregation, and per-provider routing labeling —
          each provider's exact sdk-core truthiness (anthropic isTruthy vs
