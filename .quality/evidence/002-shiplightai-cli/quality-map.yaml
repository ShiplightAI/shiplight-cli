  - id: exp-create-scaffold
    title: "`shiplight create` scaffolds safely for humans AND agents (merge contract + --json)"
    description: >-
      create writes a runnable project (package.json, playwright.config.ts with
      shiplightConfig wired, .env.example, .gitignore, example test). Against a
      populated repo it never modifies an existing file — each conflict is
      surfaced with template + merge strategy. `--json` emits the same result as
      one parseable object (the agent contract that replaced the MCP
      scaffold_project tool; snake_case wire names), with a parseable {error} on
      every failure path and post-scaffold env guidance offering both credential
      paths token-first. The scaffolder now lives in-package
      (apps/cli/src/scaffold/); the CLI has no mcp-tools dependency.
    source_type: IMPLEMENTATION
    source_refs:
      - path: "apps/cli/src/commands/create.ts"
      - path: "apps/cli/src/scaffold/index.ts"
      - path: "specs/002-shiplightai-cli/spec.md"
        label: "FR-002 / FR-019 / SC-005"
    category: other
    priority: P1
    evidence:
