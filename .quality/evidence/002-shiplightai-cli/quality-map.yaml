      - id: ev-create-command-unit
        type: unit
        path: "apps/cli/src/commands/create.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: >-
          The command seam: --json single-object/non-lossy payload (snake_case
          merge_key/lines_to_ensure, no camelCase leak), parseable {error} on
          every failure path regardless of flag order, env_setup_state from real
          directory shapes, human-output ordering, and no stale MCP-tool pointer.
      - id: ev-create-e2e
        type: e2e
        path: "apps/cli/src/commands/create.e2e.test.ts"
        command: "cd apps/cli && pnpm test:browser"
        contexts: ["local", "pr-ci"]
        notes: "Spawns the built CLI and asserts scaffolded files, ESM package.json, and shiplightConfig wiring."
    proof_gap:
      summary: "The full create -> npm install -> run chain (network install) is intentionally not run in CI."
      next_step: "Optional: a nightly job that also npm installs and runs the scaffolded example."

  - id: exp-version-pinning
    title: "Scaffolded projects pin the CLI version that created them — never a floating dist-tag"
    description: >-
      The scaffolded package.json depends on `^<running CLI version>` in BOTH the
      fresh-write and agent-merge-template paths. The previous literal "latest"
      read as self-updating but was resolved once at install time, so projects
      sat on stale CLIs while every reader assumed otherwise; a hardcoded ^0.1.0
      would be worse (caret is minor-locked below 1.0.0). The version comes from
      the CLI's own package.json — an unresolvable or invalid version fails
      before any file is written. Spec: 002 FR-002/FR-017.
    source_type: SOURCE
    source_refs:
      - path: "specs/002-shiplightai-cli/spec.md"
        label: "FR-017 declaration"
      - path: "apps/cli/src/scaffold/index.ts"
      - path: "apps/cli/src/cliVersion.ts"
    category: other
    priority: P1
    evidence:
      - id: ev-dependency-range-unit
        type: unit
        path: "apps/cli/src/scaffold/index.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: >-
          toDependencyRange caret policy: accepts exact semver (+prerelease/build),
          rejects latest/next/dev/ranges/empty; a bad version refuses BEFORE any
          filesystem write (no half-scaffolded tree); the merge template carries
          the same pin as the fresh write.
      - id: ev-real-version-seam-unit
        type: unit
        path: "apps/cli/src/commands/create.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: "The command feeds the REAL running version through: scaffolded dependency equals ^resolveCliVersion(); no floating tag string appears in output."
      - id: ev-cli-version-resolution-unit
        type: unit
        path: "apps/cli/src/cliVersion.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: "Own-package.json walk-up in bundle and source layouts; never returns a foreign package's version or the 'dev' placeholder; throws actionably on absence."

  - id: exp-transpile-strict
    title: "`transpile --strict` gates agent-authored tests on action coverage"
    description: >-
      The authoring quality gate that replaced the MCP validate_yaml_test tool:
      default mode warns on low action coverage and still emits the spec; --strict
      fails (non-zero exit) with the SAME figures and enrichment guidance. The
      coverage rule has exactly one implementation (isBelowCoverageThreshold in
      shiplight-types), so an agent and a human cannot get contradictory verdicts
      on identical YAML. --strict with zero matching files fails rather than
      passing vacuously. Spec: 002 FR-013 / SC-006.
    source_type: SOURCE
    source_refs:
      - path: "specs/002-shiplightai-cli/spec.md"
        label: "FR-013 declaration"
      - path: "apps/cli/src/commands/transpile.ts"
      - path: "packages/types/src/test-flow/validateTestYaml.ts"
    category: other
    priority: P2
    evidence:
      - id: ev-coverage-threshold-unit
        type: unit
        path: "packages/types/src/test-flow/validateTestYaml.test.ts"
        command: "pnpm --filter shiplight-types test"
        contexts: ["local", "pr-ci"]
        notes: "The single rule: isBelowCoverageThreshold provably agrees with the emitted warning on the same stats; 50% floor passes; empty flows and absent stats are not shortfalls."
      - id: ev-transpile-verdict-unit
        type: unit
        path: "apps/cli/src/commands/transpile.test.ts"
        command: "cd apps/cli && pnpm test:unit"
        contexts: ["local", "pr-ci"]
        notes: >-
          The verdict wiring over real temp-dir projects: default warns + exit 0;
          --strict escalates the same file to an error with guidance + exit 1
          (counted in one bucket); malformed YAML exits 1; --strict with zero
          matches exits 1; arg parsing keeps a leading --strict out of the glob.
    proof_gap:
      summary: "Verdict and rule are proven at the function layer; --strict is not exercised through the built cli.js binary in a gated lane."
      next_step: "Optional: one e2e invocation of `node dist/cli.js transpile --strict` in the browser lane."

