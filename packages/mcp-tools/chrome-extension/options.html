<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shiplight AI - Options</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }
    h1 {
      color: #333;
      border-bottom: 2px solid #FF5A36;
      padding-bottom: 10px;
    }
    .setting {
      margin: 20px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      color: #555;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      background: #FF5A36;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:hover {
      background: #E64A26;
    }
    .status {
      margin-top: 20px;
      padding: 10px;
      border-radius: 4px;
    }
    .status.success {
      background: #E8F5E9;
      color: #2E7D32;
    }
    .status.error {
      background: #FFEBEE;
      color: #C62828;
    }
    .help {
      background: #F5F5F5;
      padding: 15px;
      border-radius: 4px;
      margin-top: 30px;
      font-size: 14px;
    }
    .help h3 {
      margin-top: 0;
      color: #333;
    }
    .help code {
      background: #E0E0E0;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>
  <h1>Shiplight AI</h1>

  <div class="setting">
    <label for="relayPort">Relay Server Port</label>
    <input type="number" id="relayPort" placeholder="e.g. 15170" min="1" max="65535">
    <small>Enter the port from your MCP server's <code>--relay-port</code> flag.</small>
  </div>

  <button id="saveBtn">Save</button>

  <div id="status" class="status" style="display:none;"></div>

  <div class="help">
    <h3>Setup</h3>
    <p>1. Start MCP server with <code>--relay-port &lt;port&gt;</code></p>
    <p>2. Enter the same port above and click Save</p>
    <p>3. Click the Shiplight AI icon on any tab to attach</p>
  </div>

  <script src="options.js"></script>
</body>
</html>
